<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trading Account Tracker</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#111;color:#e7e7e7;font-size:14px}
.app{width:100%;max-width:760px;margin:0 auto;min-height:100vh;padding:18px 16px 12px}
h1{font-size:16px;font-weight:600;margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{padding:0 0 14px;border-bottom:1px solid #2b2b2b}
.label{color:#8f8f8f;font-size:12px;margin-bottom:5px}
.value{font-variant-numeric:tabular-nums;font-size:16px;font-weight:500}
.chat{border-top:1px solid #2b2b2b;padding-top:14px;min-height:280px}
.message{margin:0 0 13px;display:flex}
.message.user{justify-content:flex-end}
.bubble{max-width:82%;white-space:pre-wrap;line-height:1.45}
.message.user .bubble{color:#bdbdbd;text-align:right}
.message.bot .bubble{color:#ededed}
.composer{position:sticky;bottom:0;padding:12px 0 max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#111 22%)}
.form{display:flex;gap:8px;border:1px solid #303030;border-radius:10px;padding:6px;background:#181818}
input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#eee;font:inherit;padding:7px 8px}
button{border:0;background:#2b2b2b;color:#ddd;border-radius:7px;padding:7px 10px;cursor:pointer}
button:hover{background:#353535}
.status{font-size:11px;color:#777;margin-top:7px;min-height:14px}
@media(max-width:520px){.app{padding:16px 14px 10px}.stats{gap:8px}.value{font-size:15px}}
</style>
</head>
<body>
<main class="app">
  <h1>Trading Account Tracker</h1>
  <section class="stats" aria-label="Performance">
    <div class="stat"><div class="label">Overall</div><div id="overall" class="value">—</div></div>
    <div class="stat"><div class="label">Woche</div><div id="week" class="value">—</div></div>
    <div class="stat"><div class="label">Tag</div><div id="day" class="value">—</div></div>
  </section>

  <section id="chat" class="chat" aria-label="Chatverlauf"></section>

  <div class="composer">
    <form id="form" class="form">
      <input id="input" autocomplete="off" inputmode="text" placeholder="Nachricht…" aria-label="Nachricht">
      <button type="submit" aria-label="Senden">↑</button>
    </form>
    <div id="status" class="status"></div>
  </div>
</main>

<script>
/*
  1) Supabase-Projekt anlegen.
  2) supabase.sql ausführen.
  3) Die beiden Werte unten einsetzen:
     SUPABASE_URL = Project URL
     SUPABASE_ANON_KEY = Publishable/anon frontend key
*/
const SUPABASE_URL = "https://oaruibxvqqazecatabpn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_5UKDa7NfF-75rhT8uISRMQ_btXzN-FN";

const $ = id => document.getElementById(id);
const els = {overall:$("overall"),week:$("week"),day:$("day"),chat:$("chat"),input:$("input"),form:$("form"),status:$("status")};

let state = null;

function configured(){
  return SUPABASE_URL.startsWith("http") && !SUPABASE_ANON_KEY.startsWith("YOUR_");
}
function headers(){
  return {"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json"};
}
async function db(path, options={}){
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{
    ...options,headers:{...headers(),...(options.headers||{})}
  });
  if(!r.ok) throw new Error(await r.text());
  const text=await r.text();
  return text ? JSON.parse(text) : null;
}
async function loadState(){
  if(!configured()){ setStatus("Supabase URL und Public Key in index.html eintragen."); return; }
  const rows=await db("settings?select=*&id=eq.1");
  if(!rows.length) throw new Error("Settings-Datensatz fehlt. Bitte supabase.sql ausführen.");
  state=rows[0];
  render();
}
function setStatus(s=""){els.status.textContent=s}
function deNum(n){
  return Number(n).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function moneyResult(result){
  if(Object.is(result,-0)) result=0;
  const sign=result>0?"+":result<0?"-":"";
  return sign+deNum(Math.abs(result));
}
function performance(balance,start,adjustment){
  if(balance===null||start===null||balance===undefined||start===undefined) return null;
  const result=Number(balance)-Number(start)+Number(adjustment||0);
  const pct=Number(start)===0 ? 0 : result/Number(start)*100;
  return {result,pct};
}
function perfText(p){
  if(!p) return "—";
  const sign=p.pct>0?"+":p.pct<0?"-":"";
  return moneyResult(p.result)+" ("+sign+deNum(Math.abs(p.pct))+" %)";
}
function render(){
  if(!state)return;
  els.overall.textContent=perfText(performance(state.current_balance,state.start_balance,state.overall_adjustment));
  els.week.textContent=perfText(performance(state.current_balance,state.week_start,state.week_adjustment));
  els.day.textContent=perfText(performance(state.current_balance,state.day_start,state.day_adjustment));
}
function addMessage(text,who){
  const row=document.createElement("div"); row.className="message "+who;
  const b=document.createElement("div"); b.className="bubble"; b.textContent=text;
  row.appendChild(b); els.chat.appendChild(row);
  els.chat.scrollTop=els.chat.scrollHeight;
}
function num(s){
  const x=String(s).trim().replace(/\s/g,"").replace(/\.(?=\d{3}(?:\D|$))/g,"").replace(",",".");
  const n=Number(x);
  return Number.isFinite(n)?n:null;
}
function extractAfter(label,text){
  const re=new RegExp(label+"\\s*[:=]?\\s*(-?\\d+(?:[.,]\\d+)?)","i");
  const m=text.match(re); return m?num(m[1]):null;
}
function parseCommand(raw){
  const t=raw.trim();
  const lower=t.toLowerCase();

  if(lower==="reset") return {type:"reset"};

  const refs={};
  const patterns=[
    ["start_balance",/(?:startbetrag|overall\s*start(?:betrag|balance)?)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i],
    ["week_start",/(?:neuer\s+wochenstart|wochenstart|week\s*start)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i],
    ["day_start",/(?:neuer\s+tagesstart|tagesstart|day\s*start)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i]
  ];
  for(const [key,re] of patterns){const m=t.match(re);if(m)refs[key]=num(m[1]);}

  if(Object.keys(refs).length) return {type:"refs",refs};

  const dep=t.match(/(?:einzahlung|deposit)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i);
  if(dep) return {type:"deposit",amount:num(dep[1])};

  const wit=t.match(/(?:auszahlung|withdrawal)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i);
  if(wit) return {type:"withdrawal",amount:num(wit[1])};

  const balance=t.match(/^(?:kontostand\s*)?(-?\d+(?:[.,]\d+)?)$/i);
  if(balance) return {type:"balance",amount:num(balance[1])};

  return {type:"unknown"};
}
async function patch(values){
  await db("settings?id=eq.1",{method:"PATCH",headers:{"Prefer":"return=representation"},body:JSON.stringify(values)});
  Object.assign(state,values);
  render();
}
async function handle(raw){
  if(!state) await loadState();
  const c=parseCommand(raw);
  if(c.type==="unknown"){ addMessage("Unbekannter Befehl.", "bot"); return; }

  if(c.type==="reset"){
    const v={start_balance:null,week_start:null,day_start:null,current_balance:null,overall_adjustment:0,week_adjustment:0,day_adjustment:0,start_timestamp:null,week_start_timestamp:null,day_start_timestamp:null};
    await patch(v); addMessage("Reset", "bot"); return;
  }
  if(c.type==="refs"){
    const v={}; const now=new Date().toISOString();
    if(c.refs.start_balance!==undefined){v.start_balance=c.refs.start_balance;v.start_timestamp=now;v.overall_adjustment=0;}
    if(c.refs.week_start!==undefined){v.week_start=c.refs.week_start;v.week_start_timestamp=now;v.week_adjustment=0;}
    if(c.refs.day_start!==undefined){v.day_start=c.refs.day_start;v.day_start_timestamp=now;v.day_adjustment=0;}
    await patch(v); addMessage("Gespeichert", "bot"); return;
  }
  if(c.type==="balance"){
    await patch({current_balance:c.amount});
    const out=[
      "Overall: "+perfText(performance(state.current_balance,state.start_balance,state.overall_adjustment)),
      "Woche: "+perfText(performance(state.current_balance,state.week_start,state.week_adjustment)),
      "Tag: "+perfText(performance(state.current_balance,state.day_start,state.day_adjustment))
    ].join("\n");
    addMessage(out,"bot"); return;
  }
  if(c.type==="deposit"){
    const a=Math.abs(c.amount);
    await patch({
      overall_adjustment:Number(state.overall_adjustment||0)-a,
      week_adjustment:Number(state.week_adjustment||0)-a,
      day_adjustment:Number(state.day_adjustment||0)-a
    });
    addMessage("Gespeichert","bot"); return;
  }
  if(c.type==="withdrawal"){
    const a=Math.abs(c.amount);
    await patch({
      overall_adjustment:Number(state.overall_adjustment||0)+a,
      week_adjustment:Number(state.week_adjustment||0)+a,
      day_adjustment:Number(state.day_adjustment||0)+a
    });
    addMessage("Gespeichert","bot"); return;
  }
}
els.form.addEventListener("submit",async e=>{
  e.preventDefault(); const raw=els.input.value.trim(); if(!raw)return;
  addMessage(raw,"user"); els.input.value=""; setStatus("");
  try{await handle(raw);}catch(err){console.error(err);addMessage("Fehler beim Speichern.","bot");setStatus("Supabase-Verbindung prüfen.");}
});
loadState().catch(err=>{console.error(err);setStatus("Fehler: "+err.message)});
</script>
</body>
</html>
