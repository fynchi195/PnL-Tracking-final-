<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL="https://oaruibxvqqazecatabpn.supabase.co";

const SUPABASE_ANON_KEY="sb_publishable_5UKDa7NfF-75rhT8uISRMQ_btXzN-FN";

const db=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================================
   ELEMENTE
========================================================= */

const $=id=>document.getElementById(id);

const E={
  app:$("app"),
  auth:$("auth"),

  authForm:$("authForm"),
  authTitle:$("authTitle"),
  authText:$("authText"),
  authSubmit:$("authSubmit"),
  authStatus:$("authStatus"),

  switchText:$("switchText"),
  switchMode:$("switchMode"),

  email:$("email"),
  password:$("password"),

  logout:$("logout"),
  userEmail:$("userEmail"),

  overall:$("overall"),
  week:$("week"),
  day:$("day"),
  cashout:$("cashout"),

  chat:$("chat"),

  input:$("input"),
  form:$("form"),
  status:$("status")
};


let user=null;
let state=null;
let authMode="login";


/* =========================================================
   STATUS
========================================================= */

function authStatus(text="",error=false){
  E.authStatus.textContent=text;
  E.authStatus.classList.toggle("error",error);
}

function status(text=""){
  E.status.textContent=text;
}


/* =========================================================
   FORMATIERUNG
========================================================= */

function fmt(n){

  return Number(n).toLocaleString(
    "de-DE",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


function money(n){

  if(Object.is(n,-0)){
    n=0;
  }

  return (
    n>0
      ? "+"
      : n<0
        ? "-"
        : ""
  ) + fmt(Math.abs(n));

}


/* =========================================================
   PERFORMANCE
========================================================= */

function perf(balance,start,adjustment){

  if(
    balance===null ||
    balance===undefined ||
    start===null ||
    start===undefined
  ){
    return null;
  }

  const result=
    Number(balance)
    -
    Number(start)
    +
    Number(adjustment||0);

  const pct=
    Number(start)===0
      ? 0
      : result / Number(start) * 100;

  return {
    result,
    pct
  };

}


function perfText(p){

  if(!p){
    return "—";
  }

  return (
    money(p.result)
    +
    " ("
    +
    (
      p.pct>0
        ? "+"
        : p.pct<0
          ? "-"
          : ""
    )
    +
    fmt(Math.abs(p.pct))
    +
    " %)"
  );

}


/* =========================================================
   CASHOUT
========================================================= */

function cashout(){

  if(
    !state ||
    state.current_balance===null ||
    state.week_start===null
  ){
    return null;
  }

  /*
    Cashout-Regel:

    Wochenstart + 20 %

    ABER:
    mindestens 100 € müssen im Konto bleiben.
  */

  const target=Math.max(
    Number(state.week_start)*1.2,
    100
  );

  return Math.max(
    0,
    Number(state.current_balance)-target
  );

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  if(!state){
    return;
  }

  E.overall.textContent=
    perfText(
      perf(
        state.current_balance,
        state.start_balance,
        state.overall_adjustment
      )
    );

  E.week.textContent=
    perfText(
      perf(
        state.current_balance,
        state.week_start,
        state.week_adjustment
      )
    );

  E.day.textContent=
    perfText(
      perf(
        state.current_balance,
        state.day_start,
        state.day_adjustment
      )
    );

  const c=cashout();

  E.cashout.textContent=
    c===null
      ? "—"
      : fmt(c)+" €";

}


/* =========================================================
   AUTH UI
========================================================= */

function showApp(){

  E.auth.classList.add("hidden");
  E.app.classList.remove("hidden");

  E.userEmail.textContent=
    user?.email || "";

}


function showAuth(){

  E.app.classList.add("hidden");
  E.auth.classList.remove("hidden");

}


/* =========================================================
   CHAT UI
========================================================= */

function addMessage(text,who){

  const row=document.createElement("div");

  row.className=
    "message "
    +
    who;

  const bubble=document.createElement("div");

  bubble.className="bubble";

  bubble.textContent=text;

  row.appendChild(bubble);

  E.chat.appendChild(row);

  requestAnimationFrame(()=>{
    E.chat.scrollTop=
      E.chat.scrollHeight;
  });

}


function clearChat(){

  E.chat.innerHTML="";

}


/* =========================================================
   ZAHLEN PARSEN
========================================================= */

function n(value){

  if(value===null || value===undefined){
    return null;
  }

  let x=String(value)
    .trim()
    .replace(/\s/g,"");

  /*
    Deutsche Schreibweise:
    1.234,56 -> 1234.56

    Englische Schreibweise:
    1234.56 -> 1234.56
  */

  if(x.includes(",") && x.includes(".")){

    const lastComma=x.lastIndexOf(",");
    const lastDot=x.lastIndexOf(".");

    if(lastComma>lastDot){

      x=x
        .replace(/\./g,"")
        .replace(",", ".");

    }else{

      x=x.replace(/,/g,"");

    }

  }else if(x.includes(",")){

    x=x.replace(",", ".");

  }

  const z=Number(x);

  return Number.isFinite(z)
    ? z
    : null;

}


/* =========================================================
   BEFEHL PARSER
========================================================= */

function parse(raw){

  const t=raw.trim();
  const l=t.toLowerCase();

  if(l==="reset"){
    return {
      type:"reset"
    };
  }

  if(l==="cashout"){
    return {
      type:"cashout"
    };
  }


  const refs={};

  const pats=[

    [
      "start_balance",
      /(?:neuer\s+overall|overall(?:\s*start(?:betrag|balance)?)?|startbetrag)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i
    ],

    [
      "week_start",
      /(?:neuer\s+wochenstart|wochenstart|week\s*start)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i
    ],

    [
      "day_start",
      /(?:neuer\s+tagesstart|tagesstart|day\s*start)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i
    ]

  ];


  for(const [key,regex] of pats){

    const match=t.match(regex);

    if(match){

      const value=n(match[1]);

      if(value!==null){

        refs[key]=value;

      }

    }

  }


  if(Object.keys(refs).length){

    return {
      type:"refs",
      refs
    };

  }


  let m=t.match(
    /(?:einzahlung|deposit)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i
  );

  if(m){

    const amount=n(m[1]);

    if(amount!==null){

      return {
        type:"deposit",
        amount
      };

    }

  }


  m=t.match(
    /(?:auszahlung|withdrawal)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i
  );

  if(m){

    const amount=n(m[1]);

    if(amount!==null){

      return {
        type:"withdrawal",
        amount
      };

    }

  }


  m=t.match(
    /^(?:kontostand\s*)?(-?\d+(?:[.,]\d+)?)$/i
  );

  if(m){

    const amount=n(m[1]);

    if(amount!==null){

      return {
        type:"balance",
        amount
      };

    }

  }


  return {
    type:"unknown"
  };

}


/* =========================================================
   STATE LADEN
========================================================= */

async function loadState(){

  const {
    data,
    error
  }=
  await db
    .from("tracker_settings")
    .select("*")
    .eq("user_id",user.id)
    .maybeSingle();

  if(error){
    throw error;
  }


  if(data){

    state=data;

  }else{

    const {
      data:created,
      error:e
    }=
    await db
      .from("tracker_settings")
      .insert({
        user_id:user.id
      })
      .select()
      .single();

    if(e){
      throw e;
    }

    state=created;

  }

  render();

}


/* =========================================================
   STATE SPEICHERN
========================================================= */

async function patch(values){

  const {
    data,
    error
  }=
  await db
    .from("tracker_settings")
    .update(values)
    .eq("user_id",user.id)
    .select()
    .single();

  if(error){
    throw error;
  }

  state=data;

  render();

  return data;

}


/* =========================================================
   CHAT SPEICHERN
========================================================= */

async function saveChat(role,content){

  const {
    error
  }=
  await db
    .from("chat_messages")
    .insert({
      user_id:user.id,
      role,
      content
    });

  if(error){
    throw error;
  }

}


/* =========================================================
   CHAT LADEN
========================================================= */

async function loadChat(){

  const {
    data,
    error
  }=
  await db
    .from("chat_messages")
    .select(
      "id,role,content,created_at"
    )
    .eq("user_id",user.id)
    .order(
      "created_at",
      {
        ascending:true
      }
    );

  if(error){
    throw error;
  }

  clearChat();

  for(const message of data || []){

    addMessage(
      message.content,
      message.role==="user"
        ? "user"
        : "bot"
    );

  }

}


/* =========================================================
   CHAT KOMMANDOS
========================================================= */

async function bot(text){

  addMessage(text,"bot");

  await saveChat(
    "assistant",
    text
  );

}


async function userMsg(text){

  addMessage(text,"user");

  await saveChat(
    "user",
    text
  );

}


/* =========================================================
   CHATVERLAUF LÖSCHEN
========================================================= */

async function deleteChatHistory(){

  if(!user){
    return;
  }

  const {
    error
  }=
  await db
    .from("chat_messages")
    .delete()
    .eq("user_id",user.id);

  if(error){
    throw error;
  }

  clearChat();

}


/* =========================================================
   HAUPTLOGIK
========================================================= */

async function handle(raw){

  if(!state){

    await loadState();

  }


  const command=parse(raw);


  /* ---------------------------------------------
     UNBEKANNT
  --------------------------------------------- */

  if(command.type==="unknown"){

    await bot(
      "Unbekannter Befehl. Bitte gib z. B. einen Kontostand, Einzahlung, Auszahlung, Reset oder Cashout ein."
    );

    return;

  }


  /* ---------------------------------------------
     CASHOUT
  --------------------------------------------- */

  if(command.type==="cashout"){

    const amount=cashout();

    if(amount===null){

      await bot(
        "Cashout ist noch nicht berechenbar. Setze zuerst Wochenstart und Kontostand."
      );

      return;

    }


    const target=Math.max(
      Number(state.week_start)*1.2,
      100
    );


    await bot(
      "Cashout: "
      +
      fmt(amount)
      +
      " €\nVerbleibender Ziel-Kontostand: "
      +
      fmt(target)
      +
      " €"
    );

    return;

  }


  /* ---------------------------------------------
     RESET
  --------------------------------------------- */

  if(command.type==="reset"){

    /*
      Erst Daten zurücksetzen.
    */

    await patch({

      start_balance:0,
      week_start:0,
      day_start:0,

      current_balance:0,

      overall_adjustment:0,
      week_adjustment:0,
      day_adjustment:0,

      start_timestamp:null,
      week_start_timestamp:null,
      day_start_timestamp:null

    });


    /*
      Danach den kompletten Chat des Users
      aus Supabase löschen.

      Wichtig:
      Es wird KEINE "Reset"-Nachricht mehr
      gespeichert, damit der Chat wirklich leer ist.
    */

    await deleteChatHistory();

    status("Reset abgeschlossen.");

    return;

  }


  /* ---------------------------------------------
     START / WOCHENSTART / TAGESSTART
  --------------------------------------------- */

  if(command.type==="refs"){

    const values={};

    const now=
      new Date().toISOString();


    if(
      command.refs.start_balance!==undefined
    ){

      values.start_balance=
        command.refs.start_balance;

      values.start_timestamp=
        now;

      values.overall_adjustment=0;

    }


    if(
      command.refs.week_start!==undefined
    ){

      values.week_start=
        command.refs.week_start;

      values.week_start_timestamp=
        now;

      values.week_adjustment=0;

    }


    if(
      command.refs.day_start!==undefined
    ){

      values.day_start=
        command.refs.day_start;

      values.day_start_timestamp=
        now;

      values.day_adjustment=0;

    }


    await patch(values);

    await bot("Gespeichert");

    return;

  }


  /* ---------------------------------------------
     NORMALER KONTOSTAND
  --------------------------------------------- */

  if(command.type==="balance"){

    const newBalance=
      command.amount;


    if(newBalance===null){

      await bot(
        "Ungültiger Kontostand."
      );

      return;

    }


    /*
      Erst neuen Kontostand speichern.
    */

    const updated=
      await patch({
        current_balance:newBalance
      });


    /*
      Danach mit dem NEUEN State rechnen.
    */

    const overall=
      perf(
        updated.current_balance,
        updated.start_balance,
        updated.overall_adjustment
      );

    const week=
      perf(
        updated.current_balance,
        updated.week_start,
        updated.week_adjustment
      );

    const day=
      perf(
        updated.current_balance,
        updated.day_start,
        updated.day_adjustment
      );


    await bot(
      [
        "Overall: "+perfText(overall),
        "Woche: "+perfText(week),
        "Tag: "+perfText(day)
      ].join("\n")
    );

    return;

  }


  /* ---------------------------------------------
     EINZAHLUNG
  --------------------------------------------- */

  if(command.type==="deposit"){

    const amount=
      Math.abs(command.amount);


    if(
      !Number.isFinite(amount) ||
      amount<=0
    ){

      await bot(
        "Die Einzahlung muss größer als 0 € sein."
      );

      return;

    }


    const oldBalance=
      Number(state.current_balance||0);


    const newBalance=
      oldBalance + amount;


    /*
      Die Einzahlung erhöht den Kontostand,
      darf aber NICHT als Trading-Gewinn
      erscheinen.

      Deshalb wird sie vom Adjustment
      abgezogen.
    */

    const updated=
      await patch({

        current_balance:newBalance,

        overall_adjustment:
          Number(state.overall_adjustment||0)
          -
          amount,

        week_adjustment:
          Number(state.week_adjustment||0)
          -
          amount,

        day_adjustment:
          Number(state.day_adjustment||0)
          -
          amount

      });


    await bot(
      "Einzahlung: +"
      +
      fmt(amount)
      +
      " €\nKontostand: "
      +
      fmt(updated.current_balance)
      +
      " €"
    );

    return;

  }


  /* ---------------------------------------------
     AUSZAHLUNG
  --------------------------------------------- */

  if(command.type==="withdrawal"){

    const amount=
      Math.abs(command.amount);


    if(
      !Number.isFinite(amount) ||
      amount<=0
    ){

      await bot(
        "Die Auszahlung muss größer als 0 € sein."
      );

      return;

    }


    const oldBalance=
      Number(state.current_balance||0);


    /*
      Auszahlung darf den Kontostand
      nicht unter 0 € bringen.
    */

    if(amount>oldBalance){

      await bot(
        "Auszahlung nicht möglich.\n"
        +
        "Aktueller Kontostand: "
        +
        fmt(oldBalance)
        +
        " €"
      );

      return;

    }


    const newBalance=
      oldBalance - amount;


    /*
      Auszahlung verändert den Kontostand,
      ist aber KEIN Trading-Verlust.

      Deshalb wird sie zum Adjustment
      addiert.
    */

    const updated=
      await patch({

        current_balance:newBalance,

        overall_adjustment:
          Number(state.overall_adjustment||0)
          +
          amount,

        week_adjustment:
          Number(state.week_adjustment||0)
          +
          amount,

        day_adjustment:
          Number(state.day_adjustment||0)
          +
          amount

      });


    await bot(
      "Auszahlung: -"
      +
      fmt(amount)
      +
      " €\nKontostand: "
      +
      fmt(updated.current_balance)
      +
      " €"
    );

    return;

  }

}


/* =========================================================
   AUTH MODUS
========================================================= */

E.switchMode.addEventListener(
  "click",
  ()=>{

    authMode=
      authMode==="login"
        ? "signup"
        : "login";

    authStatus("");

    updateAuth();

  }
);


function updateAuth(){

  const login=
    authMode==="login";


  E.authTitle.textContent=
    login
      ? "Anmelden"
      : "Account erstellen";


  E.authText.textContent=
    login

      ? "Melde dich an, um deinen Trading-Tracker und Chatverlauf auf allen Geräten zu nutzen."

      : "Erstelle deinen Account. Deine Trading-Daten und dein Chatverlauf werden diesem Account zugeordnet.";


  E.authSubmit.textContent=
    login
      ? "Anmelden"
      : "Registrieren";


  E.switchText.textContent=
    login
      ? "Noch kein Account?"
      : "Schon einen Account?";


  E.switchMode.textContent=
    login
      ? "Registrieren"
      : "Anmelden";


  E.password.autocomplete=
    login
      ? "current-password"
      : "new-password";

}


/* =========================================================
   LOGIN / REGISTRIERUNG
========================================================= */

E.authForm.addEventListener(
  "submit",
  async e=>{

    e.preventDefault();

    authStatus("");


    const email=
      E.email.value.trim();

    const password=
      E.password.value;


    E.authSubmit.disabled=true;


    try{

      if(authMode==="login"){

        const {
          error
        }=
        await db.auth.signInWithPassword({
          email,
          password
        });

        if(error){
          throw error;
        }

      }else{

        const {
          data,
          error
        }=
        await db.auth.signUp({
          email,
          password
        });


        if(error){
          throw error;
        }


        if(!data.session){

          authStatus(
            "Account erstellt. Bitte E-Mail bestätigen und danach anmelden."
          );

        }

      }

    }catch(error){

      console.error(error);

      authStatus(
        error?.message ||
        "Anmeldung fehlgeschlagen.",
        true
      );

    }finally{

      E.authSubmit.disabled=false;

    }

  }
);


/* =========================================================
   LOGOUT
========================================================= */

E.logout.addEventListener(
  "click",
  async ()=>{

    try{

      await db.auth.signOut();

    }catch(error){

      console.error(error);

    }

    user=null;
    state=null;

    clearChat();

    showAuth();

    authStatus("");

  }
);


/* =========================================================
   CHAT FORM
========================================================= */

E.form.addEventListener(
  "submit",
  async e=>{

    e.preventDefault();


    const raw=
      E.input.value.trim();


    if(!raw || !user){
      return;
    }


    E.input.value="";

    status("");


    try{

      await userMsg(raw);

      await handle(raw);

    }catch(error){

      console.error(error);

      status(
        "Fehler: "
        +
        (
          error?.message ||
          "Supabase prüfen."
        )
      );

    }

  }
);


/* =========================================================
   START
========================================================= */

async function boot(){

  updateAuth();


  try{

    const {
      data,
      error
    }=
    await db.auth.getSession();


    if(error){
      throw error;
    }


    user=
      data.session?.user ||
      null;


    if(!user){

      showAuth();

      return;

    }


    showApp();

    await loadState();

    await loadChat();


  }catch(error){

    console.error(error);

    showAuth();

    authStatus(
      "Fehler: "
      +
      (
        error?.message ||
        ""
      ),
      true
    );

  }

}


/* =========================================================
   AUTH STATE CHANGE
========================================================= */

db.auth.onAuthStateChange(
  async(_event,session)=>{

    user=
      session?.user ||
      null;


    if(user){

      try{

        showApp();

        await loadState();

        await loadChat();

      }catch(error){

        console.error(error);

        status(
          "Fehler beim Laden: "
          +
          (
            error?.message ||
            ""
          )
        );

      }

    }else{

      state=null;

      clearChat();

      showAuth();

    }

  }
);


/* =========================================================
   APP STARTEN
========================================================= */

boot();

</script>
