<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trading Account Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#111;color:#e7e7e7;font-size:14px}
body{overflow:hidden}
button,input{font:inherit} button{cursor:pointer}
.app{width:100%;max-width:820px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:0 16px}
.header{position:sticky;top:0;z-index:10;background:#111;border-bottom:1px solid #2b2b2b;padding:15px 0 12px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:16px;font-weight:600;margin:0}
.userline{display:flex;align-items:center;gap:8px;color:#777;font-size:11px}
.linkbtn{border:0;background:none;color:#aaa;padding:0;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{min-width:0}.label{color:#8f8f8f;font-size:11px;margin-bottom:4px}
.value{font-variant-numeric:tabular-nums;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{flex:1;overflow-y:auto;min-height:0;padding:18px 0 10px;scrollbar-width:thin}
.message{margin:0 0 13px;display:flex}.message.user{justify-content:flex-end}
.bubble{max-width:82%;white-space:pre-wrap;line-height:1.45}
.message.user .bubble{color:#bdbdbd;text-align:right}.message.bot .bubble{color:#ededed}
.composer{flex:0 0 auto;padding:10px 0 max(12px,env(safe-area-inset-bottom));background:#111}
.form{display:flex;gap:8px;border:1px solid #303030;border-radius:10px;padding:6px;background:#181818}
input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#eee;padding:7px 8px}
button.send{border:0;background:#2b2b2b;color:#ddd;border-radius:7px;padding:7px 10px}
.status{font-size:11px;color:#777;margin-top:7px;min-height:14px}.error{color:#d0a0a0!important}
.auth{width:100%;max-width:380px;margin:auto;padding:24px 16px}
.auth h2{font-size:20px;margin:0 0 7px}.auth p{color:#888;line-height:1.45;margin:0 0 18px;font-size:13px}
.authform{display:grid;gap:9px}.authform input{border:1px solid #303030;border-radius:9px;background:#181818;padding:11px 12px}
.authform button{border:0;border-radius:9px;background:#e7e7e7;color:#111;padding:10px 12px;font-weight:600}
.authform button:disabled{opacity:.5}.auth-switch{margin-top:12px;text-align:center;color:#777;font-size:12px}
.auth-switch button{border:0;background:none;color:#ccc;padding:0}.hidden{display:none!important}
@media(max-width:620px){.app{padding:0 13px}.stats{gap:9px}.value{font-size:13px}.label{font-size:10px}}
</style>
</head>
<body>

<main id="app" class="app hidden">
<header class="header">
<div class="topline">
<h1>Trading Account Tracker</h1>
<div class="userline"><span id="userEmail"></span><button id="logout" class="linkbtn">Abmelden</button></div>
</div>
<section class="stats">
<div class="stat"><div class="label">Overall</div><div id="overall" class="value">—</div></div>
<div class="stat"><div class="label">Weekly</div><div id="week" class="value">—</div></div>
<div class="stat"><div class="label">Daily</div><div id="day" class="value">—</div></div>
<div class="stat"><div class="label">Cashout</div><div id="cashout" class="value">—</div></div>
</section>
</header>

<section id="chat" class="chat"></section>

<div class="composer">
<form id="form" class="form">
<input id="input" autocomplete="off" placeholder="Nachricht…" aria-label="Nachricht">
<button class="send" type="submit">↑</button>
</form>
<div id="status" class="status"></div>
</div>
</main>

<section id="auth" class="auth">
<h2 id="authTitle">Anmelden</h2>
<p id="authText">Melde dich an, um deinen eigenen Trading-Tracker und Chatverlauf auf allen Geräten zu nutzen.</p>
<form id="authForm" class="authform">
<input id="email" type="email" autocomplete="email" placeholder="E-Mail" required>
<input id="password" type="password" autocomplete="current-password" placeholder="Passwort (mind. 6 Zeichen)" minlength="6" required>
<button id="authSubmit" type="submit">Anmelden</button>
</form>
<div id="authStatus" class="status"></div>
<div class="auth-switch"><span id="switchText">Noch kein Account?</span> <button id="switchMode" type="button">Registrieren</button></div>
</section>

<script>
const SUPABASE_URL="https://oaruibxvqqazecatabpn.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_5UKDa7NfF-75rhT8uISRMQ_btXzN-FN";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const E={
app:$("app"),auth:$("auth"),authForm:$("authForm"),authTitle:$("authTitle"),authText:$("authText"),
authSubmit:$("authSubmit"),authStatus:$("authStatus"),switchText:$("switchText"),switchMode:$("switchMode"),
email:$("email"),password:$("password"),logout:$("logout"),userEmail:$("userEmail"),
overall:$("overall"),week:$("week"),day:$("day"),cashout:$("cashout"),chat:$("chat"),
input:$("input"),form:$("form"),status:$("status")
};
let user=null,state=null,authMode="login";

function authStatus(t="",err=false){E.authStatus.textContent=t;E.authStatus.classList.toggle("error",err)}
function status(t=""){E.status.textContent=t}
function fmt(n){return Number(n).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})}
function money(n){if(Object.is(n,-0))n=0;return (n>0?"+":n<0?"-":"")+fmt(Math.abs(n))}
function perf(balance,start,adj){
if(balance==null||start==null)return null;
const result=Number(balance)-Number(start)+Number(adj||0);
const pct=Number(start)===0?0:result/Number(start)*100;
return {result,pct};
}
function perfText(p){
if(!p)return "—";
return money(p.result)+" ("+(p.pct>0?"+":p.pct<0?"-":"")+fmt(Math.abs(p.pct))+" %)";
}
function cashout(){
if(!state||state.current_balance==null||state.week_start==null)return null;
const target=Math.max(Number(state.week_start)*1.2,100);
return Math.max(0,Number(state.current_balance)-target);
}
function render(){
if(!state)return;
E.overall.textContent=perfText(perf(state.current_balance,state.start_balance,state.overall_adjustment));
E.week.textContent=perfText(perf(state.current_balance,state.week_start,state.week_adjustment));
E.day.textContent=perfText(perf(state.current_balance,state.day_start,state.day_adjustment));
const c=cashout(); E.cashout.textContent=c==null?"—":fmt(c)+" €";
}
function showApp(){E.auth.classList.add("hidden");E.app.classList.remove("hidden");E.userEmail.textContent=user?.email||""}
function showAuth(){E.app.classList.add("hidden");E.auth.classList.remove("hidden")}
function addMessage(text,who){
const row=document.createElement("div");row.className="message "+who;
const b=document.createElement("div");b.className="bubble";b.textContent=text;row.appendChild(b);E.chat.appendChild(row);
requestAnimationFrame(()=>E.chat.scrollTop=E.chat.scrollHeight);
}
function clearChat(){E.chat.innerHTML=""}
function n(v){
const x=String(v).trim().replace(/\s/g,"").replace(/\.(?=\d{3}(?:\D|$))/g,"").replace(",",".");
const z=Number(x);return Number.isFinite(z)?z:null;
}
function parse(raw){
const t=raw.trim(),l=t.toLowerCase();
if(l==="reset")return{type:"reset"};
if(l==="cashout")return{type:"cashout"};
const refs={},pats=[
["start_balance",/(?:neuer\s+overall|overall(?:\s*start(?:betrag|balance)?)?|startbetrag)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i],
["week_start",/(?:neuer\s+wochenstart|wochenstart|week\s*start)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i],
["day_start",/(?:neuer\s+tagesstart|tagesstart|day\s*start)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i]
];
for(const [k,r] of pats){const m=t.match(r);if(m)refs[k]=n(m[1])}
if(Object.keys(refs).length)return{type:"refs",refs};
let m=t.match(/(?:einzahlung|deposit)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i);
if(m)return{type:"deposit",amount:n(m[1])};
m=t.match(/(?:auszahlung|withdrawal)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i);
if(m)return{type:"withdrawal",amount:n(m[1])};
m=t.match(/^(?:kontostand\s*)?(-?\d+(?:[.,]\d+)?)$/i);
if(m)return{type:"balance",amount:n(m[1])};
return{type:"unknown"};
}
async function loadState(){
const {data,error}=await db.from("tracker_settings").select("*").eq("user_id",user.id).maybeSingle();
if(error)throw error;
if(data)state=data;
else{
const {data:created,error:e}=await db.from("tracker_settings").insert({user_id:user.id}).select().single();
if(e)throw e;state=created;
}
render();
}
async function patch(v){
const {data,error}=await db.from("tracker_settings").update(v).eq("user_id",user.id).select().single();
if(error)throw error;state=data;render();
}
async function saveChat(role,content){
const {error}=await db.from("chat_messages").insert({user_id:user.id,role,content});
if(error)throw error;
}
async function loadChat(){
const {data,error}=await db.from("chat_messages").select("id,role,content,created_at").eq("user_id",user.id).order("created_at",{ascending:true});
if(error)throw error;clearChat();for(const m of data||[])addMessage(m.content,m.role==="user"?"user":"bot");
}
async function bot(text){addMessage(text,"bot");await saveChat("assistant",text)}
async function userMsg(text){addMessage(text,"user");await saveChat("user",text)}

async function handle(raw){
if(!state)await loadState();
const c=parse(raw);
if(c.type==="unknown"){await bot("Unbekannter Befehl.");return}
if(c.type==="cashout"){
const amount=cashout();
if(amount==null){await bot("Cashout ist noch nicht berechenbar. Setze zuerst Wochenstart und Kontostand.");return}
const target=Math.max(Number(state.week_start)*1.2,100);
await bot("Cashout: "+fmt(amount)+" €\nVerbleibender Ziel-Kontostand: "+fmt(target)+" €");return;
}
if(c.type==="reset"){
await patch({start_balance:null,week_start:null,day_start:null,current_balance:null,overall_adjustment:0,week_adjustment:0,day_adjustment:0,start_timestamp:null,week_start_timestamp:null,day_start_timestamp:null});
await bot("Reset");return;
}
if(c.type==="refs"){
const v={},now=new Date().toISOString();
if(c.refs.start_balance!==undefined){v.start_balance=c.refs.start_balance;v.start_timestamp=now;v.overall_adjustment=0}
if(c.refs.week_start!==undefined){v.week_start=c.refs.week_start;v.week_start_timestamp=now;v.week_adjustment=0}
if(c.refs.day_start!==undefined){v.day_start=c.refs.day_start;v.day_start_timestamp=now;v.day_adjustment=0}
await patch(v);await bot("Gespeichert");return;
}
if(c.type==="balance"){
await patch({current_balance:c.amount});
await bot([
"Overall: "+perfText(perf(state.current_balance,state.start_balance,state.overall_adjustment)),
"Woche: "+perfText(perf(state.current_balance,state.week_start,state.week_adjustment)),
"Tag: "+perfText(perf(state.current_balance,state.day_start,state.day_adjustment))
].join("\n"));return;
}
if(c.type==="deposit"){
const a=Math.abs(c.amount);
const newBalance=Number(state.current_balance||0)+a;
await patch({
current_balance:newBalance,
overall_adjustment:Number(state.overall_adjustment||0)-a,
week_adjustment:Number(state.week_adjustment||0)-a,
day_adjustment:Number(state.day_adjustment||0)-a
});
await bot("Einzahlung: +"+fmt(a)+" €\nKontostand: "+fmt(newBalance)+" €");return;
}
if(c.type==="withdrawal"){
const a=Math.abs(c.amount);
const newBalance=Number(state.current_balance||0)-a;
await patch({
current_balance:newBalance,
overall_adjustment:Number(state.overall_adjustment||0)+a,
week_adjustment:Number(state.week_adjustment||0)+a,
day_adjustment:Number(state.day_adjustment||0)+a
});
await bot("Auszahlung: -"+fmt(a)+" €\nKontostand: "+fmt(newBalance)+" €");return;
}
}

E.switchMode.addEventListener("click",()=>{authMode=authMode==="login"?"signup":"login";authStatus("");updateAuth()});
function updateAuth(){
const login=authMode==="login";
E.authTitle.textContent=login?"Anmelden":"Account erstellen";
E.authText.textContent=login?"Melde dich an, um deinen Trading-Tracker und Chatverlauf auf allen Geräten zu nutzen.":"Erstelle deinen Account. Deine Trading-Daten und dein Chatverlauf werden diesem Account zugeordnet.";
E.authSubmit.textContent=login?"Anmelden":"Registrieren";
E.switchText.textContent=login?"Noch kein Account?":"Schon einen Account?";
E.switchMode.textContent=login?"Registrieren":"Anmelden";
E.password.autocomplete=login?"current-password":"new-password";
}
E.authForm.addEventListener("submit",async e=>{
e.preventDefault();authStatus("");
const email=E.email.value.trim(),password=E.password.value;
E.authSubmit.disabled=true;
try{
if(authMode==="login"){
const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;
}else{
const {data,error}=await db.auth.signUp({email,password});
if(error)throw error;
if(!data.session)authStatus("Account erstellt. Bitte E-Mail bestätigen und danach anmelden.");
}
}catch(err){
console.error(err);authStatus(err?.message||"Anmeldung fehlgeschlagen.",true);
}finally{E.authSubmit.disabled=false}
});
E.logout.addEventListener("click",async()=>{await db.auth.signOut();user=null;state=null;clearChat();showAuth();authStatus("")});
E.form.addEventListener("submit",async e=>{
e.preventDefault();const raw=E.input.value.trim();if(!raw||!user)return;
E.input.value="";status("");
try{await userMsg(raw);await handle(raw)}
catch(err){console.error(err);status("Fehler: "+(err?.message||"Supabase prüfen."))}
});
async function boot(){
updateAuth();
try{
const {data,error}=await db.auth.getSession();if(error)throw error;
user=data.session?.user||null;
if(!user){showAuth();return}
showApp();await loadState();await loadChat();
}catch(err){console.error(err);showAuth();authStatus("Fehler: "+(err?.message||""),true)}
}
db.auth.onAuthStateChange(async(_event,session)=>{
user=session?.user||null;
if(user){
try{showApp();await loadState();await loadChat()}
catch(err){console.error(err);status("Fehler beim Laden: "+(err?.message||""))}
}else{state=null;clearChat();showAuth()}
});
boot();
</script>
</body>
</html>
