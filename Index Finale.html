<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trading Account Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#111;color:#e7e7e7;font-size:14px}
body{overflow:hidden}
button,input{font:inherit}
button{cursor:pointer}
.app{width:100%;max-width:820px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:0 16px}
.header{position:sticky;top:0;z-index:10;background:#111;border-bottom:1px solid #2b2b2b;padding:15px 0 12px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:16px;font-weight:600;margin:0}
.userline{display:flex;align-items:center;gap:8px;color:#777;font-size:11px}
.linkbtn{border:0;background:none;color:#aaa;padding:0;font-size:11px}
.linkbtn:hover{color:#eee}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{min-width:0}
.label{color:#8f8f8f;font-size:11px;margin-bottom:4px}
.value{font-variant-numeric:tabular-nums;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cashout .value{color:#e7e7e7}
.chat{flex:1;overflow-y:auto;min-height:0;padding:18px 0 10px;scrollbar-width:thin}
.message{margin:0 0 13px;display:flex}
.message.user{justify-content:flex-end}
.bubble{max-width:82%;white-space:pre-wrap;line-height:1.45}
.message.user .bubble{color:#bdbdbd;text-align:right}
.message.bot .bubble{color:#ededed}
.composer{flex:0 0 auto;padding:10px 0 max(12px,env(safe-area-inset-bottom));background:#111}
.form{display:flex;gap:8px;border:1px solid #303030;border-radius:10px;padding:6px;background:#181818}
input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#eee;padding:7px 8px}
button.send{border:0;background:#2b2b2b;color:#ddd;border-radius:7px;padding:7px 10px}
button.send:hover{background:#353535}
.status{font-size:11px;color:#777;margin-top:7px;min-height:14px}
.auth{width:100%;max-width:380px;margin:auto;padding:24px 0}
.auth h2{font-size:20px;margin:0 0 7px}
.auth p{color:#888;line-height:1.45;margin:0 0 18px;font-size:13px}
.authform{display:grid;gap:9px}
.authform input{border:1px solid #303030;border-radius:9px;background:#181818;padding:11px 12px}
.authform button{border:0;border-radius:9px;background:#e7e7e7;color:#111;padding:10px 12px;font-weight:600}
.auth-switch{margin-top:12px;text-align:center;color:#777;font-size:12px}
.auth-switch button{border:0;background:none;color:#ccc;padding:0}
.hidden{display:none!important}
.error{color:#d0a0a0!important}
@media(max-width:620px){.app{padding:0 13px}.stats{gap:9px}.value{font-size:13px}.label{font-size:10px}}
</style>
</head>
<body>
<main id="app" class="app hidden">
  <header class="header">
    <div class="topline">
      <h1>Trading Account Tracker</h1>
      <div class="userline"><span id="userEmail"></span><button id="logout" class="linkbtn">Abmelden</button></div>
    </div>
    <section class="stats" aria-label="Performance">
      <div class="stat"><div class="label">Overall</div><div id="overall" class="value">—</div></div>
      <div class="stat"><div class="label">Weekly</div><div id="week" class="value">—</div></div>
      <div class="stat"><div class="label">Daily</div><div id="day" class="value">—</div></div>
      <div class="stat cashout"><div class="label">Cashout</div><div id="cashout" class="value">—</div></div>
    </section>
  </header>

  <section id="chat" class="chat" aria-label="Chatverlauf"></section>

  <div class="composer">
    <form id="form" class="form">
      <input id="input" autocomplete="off" inputmode="text" placeholder="Nachricht…" aria-label="Nachricht">
      <button class="send" type="submit" aria-label="Senden">↑</button>
    </form>
    <div id="status" class="status"></div>
  </div>
</main>

<section id="auth" class="auth">
  <h2 id="authTitle">Anmelden</h2>
  <p id="authText">Melde dich an, um deinen eigenen Trading-Tracker und Chatverlauf auf allen Geräten zu nutzen.</p>
  <form id="authForm" class="authform">
    <input id="email" type="email" autocomplete="email" placeholder="E-Mail" required>
    <input id="password" type="password" autocomplete="current-password" placeholder="Passwort (mind. 6 Zeichen)" minlength="6" required>
    <button id="authSubmit" type="submit">Anmelden</button>
  </form>
  <div id="authStatus" class="status"></div>
  <div class="auth-switch"><span id="switchText">Noch kein Account?</span> <button id="switchMode" type="button">Registrieren</button></div>
</section>

<script>
const SUPABASE_URL = "https://oaruibxvqqazecatabpn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_5UKDa7NfF-75rhT8uISRMQ_btXzN-FN";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const els = {
  app:$('app'), auth:$('auth'), authForm:$('authForm'), authTitle:$('authTitle'), authText:$('authText'),
  authSubmit:$('authSubmit'), authStatus:$('authStatus'), switchText:$('switchText'), switchMode:$('switchMode'),
  email:$('email'), password:$('password'), logout:$('logout'), userEmail:$('userEmail'),
  overall:$('overall'), week:$('week'), day:$('day'), cashout:$('cashout'), chat:$('chat'), input:$('input'), form:$('form'), status:$('status')
};

let user = null;
let state = null;
let authMode = 'login';

function setAuthStatus(text='', error=false){els.authStatus.textContent=text;els.authStatus.classList.toggle('error',error)}
function setStatus(text=''){els.status.textContent=text}
function deNum(n){return Number(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})}
function moneyResult(result){if(Object.is(result,-0))result=0;const sign=result>0?'+':result<0?'-':'';return sign+deNum(Math.abs(result))}
function performance(balance,start,adjustment){
  if(balance===null||start===null||balance===undefined||start===undefined)return null;
  const result=Number(balance)-Number(start)+Number(adjustment||0);
  const pct=Number(start)===0?0:result/Number(start)*100;
  return {result,pct};
}
function perfText(p){
  if(!p)return '—';
  const sign=p.pct>0?'+':p.pct<0?'-':'';
  return moneyResult(p.result)+' ('+sign+deNum(Math.abs(p.pct))+' %)';
}
function cashoutAmount(){
  if(!state||state.current_balance===null||state.week_start===null)return null;
  const target=Math.max(Number(state.week_start)*1.20,100);
  return Math.max(0,Number(state.current_balance)-target);
}
function render(){
  if(!state)return;
  els.overall.textContent=perfText(performance(state.current_balance,state.start_balance,state.overall_adjustment));
  els.week.textContent=perfText(performance(state.current_balance,state.week_start,state.week_adjustment));
  els.day.textContent=perfText(performance(state.current_balance,state.day_start,state.day_adjustment));
  const c=cashoutAmount();
  els.cashout.textContent=c===null?'—':deNum(c)+' €';
}
function addMessage(text,who){
  const row=document.createElement('div');row.className='message '+who;
  const b=document.createElement('div');b.className='bubble';b.textContent=text;row.appendChild(b);els.chat.appendChild(row);
  els.chat.scrollTop=els.chat.scrollHeight;
}
function clearChat(){els.chat.innerHTML=''}
function num(s){
  const x=String(s).trim().replace(/\s/g,'').replace(/\.(?=\d{3}(?:\D|$))/g,'').replace(',','.');
  const n=Number(x);return Number.isFinite(n)?n:null;
}
function parseCommand(raw){
  const t=raw.trim(),lower=t.toLowerCase();
  if(lower==='reset')return {type:'reset'};
  const refs={};
  const patterns=[
    ['start_balance',/(?:startbetrag|overall\s*start(?:betrag|balance)?)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i],
    ['week_start',/(?:neuer\s+wochenstart|wochenstart|week\s*start)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i],
    ['day_start',/(?:neuer\s+tagesstart|tagesstart|day\s*start)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i]
  ];
  for(const [key,re] of patterns){const m=t.match(re);if(m)refs[key]=num(m[1]);}
  if(Object.keys(refs).length)return {type:'refs',refs};
  const dep=t.match(/(?:einzahlung|deposit)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i);if(dep)return {type:'deposit',amount:num(dep[1])};
  const wit=t.match(/(?:auszahlung|withdrawal|cashout)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i);if(wit)return {type:'withdrawal',amount:num(wit[1])};
  const balance=t.match(/^(?:kontostand\s*)?(-?\d+(?:[.,]\d+)?)$/i);if(balance)return {type:'balance',amount:num(balance[1])};
  if(lower==='cashout')return {type:'cashout'};
  return {type:'unknown'};
}

async function loadState(){
  const {data,error}=await supabase.from('tracker_settings').select('*').eq('user_id',user.id).maybeSingle();
  if(error)throw error;
  if(!data){
    const {data:created,error:createError}=await supabase.from('tracker_settings').insert({user_id:user.id}).select().single();
    if(createError)throw createError;state=created;
  }else state=data;
  render();
}
async function patch(values){
  const {data,error}=await supabase.from('tracker_settings').update(values).eq('user_id',user.id).select().single();
  if(error)throw error;state=data;render();
}
async function saveChat(role,content){
  const {error}=await supabase.from('chat_messages').insert({user_id:user.id,role,content});
  if(error)throw error;
}
async function loadChat(){
  const {data,error}=await supabase.from('chat_messages').select('id,role,content,created_at').eq('user_id',user.id).order('created_at',{ascending:true});
  if(error)throw error;clearChat();for(const m of data)addMessage(m.content,m.role==='user'?'user':'bot');
}

async function botMessage(text){addMessage(text,'bot');await saveChat('bot',text)}
async function userMessage(text){addMessage(text,'user');await saveChat('user',text)}

async function handle(raw){
  if(!state)await loadState();
  const c=parseCommand(raw);
  if(c.type==='unknown'){await botMessage('Unbekannter Befehl.');return}
  if(c.type==='cashout'){
    const amount=cashoutAmount();
    if(amount===null){await botMessage('Cashout ist noch nicht berechenbar. Setze zuerst Wochenstart und Kontostand.');return}
    const target=Math.max(Number(state.week_start)*1.20,100);
    await botMessage('Cashout: '+deNum(amount)+' €\nVerbleibender Ziel-Kontostand: '+deNum(target)+' €');return;
  }
  if(c.type==='reset'){
    await patch({start_balance:null,week_start:null,day_start:null,current_balance:null,overall_adjustment:0,week_adjustment:0,day_adjustment:0,start_timestamp:null,week_start_timestamp:null,day_start_timestamp:null});
    await botMessage('Reset');return;
  }
  if(c.type==='refs'){
    const v={},now=new Date().toISOString();
    if(c.refs.start_balance!==undefined){v.start_balance=c.refs.start_balance;v.start_timestamp=now;v.overall_adjustment=0}
    if(c.refs.week_start!==undefined){v.week_start=c.refs.week_start;v.week_start_timestamp=now;v.week_adjustment=0}
    if(c.refs.day_start!==undefined){v.day_start=c.refs.day_start;v.day_start_timestamp=now;v.day_adjustment=0}
    await patch(v);await botMessage('Gespeichert');return;
  }
  if(c.type==='balance'){
    await patch({current_balance:c.amount});
    const out=['Overall: '+perfText(performance(state.current_balance,state.start_balance,state.overall_adjustment)), 'Woche: '+perfText(performance(state.current_balance,state.week_start,state.week_adjustment)), 'Tag: '+perfText(performance(state.current_balance,state.day_start,state.day_adjustment))].join('\n');
    await botMessage(out);return;
  }
  if(c.type==='deposit'){
    const a=Math.abs(c.amount);await patch({overall_adjustment:Number(state.overall_adjustment||0)-a,week_adjustment:Number(state.week_adjustment||0)-a,day_adjustment:Number(state.day_adjustment||0)-a});await botMessage('Gespeichert');return;
  }
  if(c.type==='withdrawal'){
    const a=Math.abs(c.amount);await patch({overall_adjustment:Number(state.overall_adjustment||0)+a,week_adjustment:Number(state.week_adjustment||0)+a,day_adjustment:Number(state.day_adjustment||0)+a});await botMessage('Gespeichert');return;
  }
}

function showApp(){els.auth.classList.add('hidden');els.app.classList.remove('hidden');els.userEmail.textContent=user?.email||''}
function showAuth(){els.app.classList.add('hidden');els.auth.classList.remove('hidden')}
function updateAuthMode(){
  const login=authMode==='login';
  els.authTitle.textContent=login?'Anmelden':'Account erstellen';
  els.authText.textContent=login?'Melde dich an, um deinen eigenen Trading-Tracker und Chatverlauf auf allen Geräten zu nutzen.':'Erstelle einen Account. Deine Tracker-Daten und dein kompletter Chat werden diesem Account zugeordnet.';
  els.authSubmit.textContent=login?'Anmelden':'Registrieren';
  els.switchText.textContent=login?'Noch kein Account?':'Schon einen Account?';
  els.switchMode.textContent=login?'Registrieren':'Anmelden';
  els.password.autocomplete=login?'current-password':'new-password';
}

els.switchMode.addEventListener('click',()=>{authMode=authMode==='login'?'signup':'login';setAuthStatus('');updateAuthMode()});
els.authForm.addEventListener('submit',async e=>{
  e.preventDefault();setAuthStatus('');
  try{
    const email=els.email.value.trim(),password=els.password.value;
    if(authMode==='login'){
      const {error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;
    }else{
      const {data,error}=await supabase.auth.signUp({email,password});if(error)throw error;
      if(!data.session){setAuthStatus('Account erstellt. Prüfe deine E-Mail und bestätige den Account. Danach anmelden.');return}
    }
  }catch(err){console.error(err);setAuthStatus(err.message||'Anmeldung fehlgeschlagen.',true)}
});

els.logout.addEventListener('click',async()=>{await supabase.auth.signOut();user=null;state=null;clearChat();showAuth();setAuthStatus('');});
els.form.addEventListener('submit',async e=>{
  e.preventDefault();const raw=els.input.value.trim();if(!raw||!user)return;
  els.input.value='';setStatus('');
  try{await userMessage(raw);await handle(raw)}catch(err){console.error(err);await botMessage('Fehler beim Speichern.');setStatus('Supabase prüfen.')}
});

async function boot(){
  updateAuthMode();
  const {data}=await supabase.auth.getSession();
  user=data.session?.user||null;
  if(!user){showAuth();return}
  try{showApp();await loadState();await loadChat();}
  catch(err){console.error(err);setStatus('Fehler beim Laden: '+(err.message||''))}
}
supabase.auth.onAuthStateChange(async(_event,session)=>{
  user=session?.user||null;
  if(user){
    try{showApp();await loadState();await loadChat()}catch(err){console.error(err);setStatus('Fehler beim Laden: '+(err.message||''))}
  }else{state=null;clearChat();showAuth()}
});
boot();
</script>
</body>
</html>
